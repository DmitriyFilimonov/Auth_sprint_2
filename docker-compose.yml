version: '3.8'
services:

  etl:
    build:
      context: ./etl_service
      dockerfile: Dockerfile
    env_file:
      - ./.env
    depends_on:
      theatre-db:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy

  fastapi:
    build:
      context: .
      dockerfile: fast_api/Dockerfile
    image: fastapi-image
    ports:
      - "8000:8000"
    expose:
      - "8000"
    environment:
      - REQUEST_LIMIT_PER_SECOND=20
    env_file:
      - ./.env
    depends_on:
      theatre-db:
        condition: service_healthy
      auth-circuit-breaker:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:1.27.4
    volumes:
      - ./configs/nginx:/etc/nginx/conf.d:ro
      - admin-static:/admin-static
    depends_on:
      fastapi:
        condition: service_started
      admin:
        condition: service_started
      auth-circuit-breaker:
        condition: service_healthy
    ports:
      - "80:80"

  theatre-db:
    image: postgres:17.4
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./database_dump.sql:/docker-entrypoint-initdb.d/init.sql
      # После init.sql (лексикографический порядок: z > init). Только при первом создании тома pg-data.
      - ./database_migrations/001_film_work_is_deleted.sql:/docker-entrypoint-initdb.d/z_film_work_is_deleted.sql
    expose:
      - "${POSTGRES_PORT}"
    env_file:
      - ./.env
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  elasticsearch:
    image: elasticsearch:8.6.2
    volumes:
      - elastic-data:/usr/share/elasticsearch/data
    expose:
      - "${ELASTIC_PORT}"
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms200m -Xmx200m"
    healthcheck:
      test: [ "CMD", "curl", "-s", "http://localhost:9200" ]
      interval: 10s
      timeout: 10s
      retries: 15

  redis:
    image: redis:7.4.3
    volumes:
      - redis-data:/data
      - ./configs/redis/redis.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf
    expose:
      - "${REDIS_PORT}"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 10s
      retries: 15

  authapi:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    expose:
      - "8000"
    env_file:
      - ./auth-service/.env
    environment:
      - POSTGRES_MIGRATIONS_HOST=auth-db
    restart: unless-stopped
    depends_on:
      auth-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "python3", "-c", "from urllib import request; request.urlopen('http://localhost:8000/users/ping')" ]
      interval: 10s
      timeout: 5s
      retries: 3

  auth-circuit-breaker:
    build:
      context: ./auth-circuit-breaker
      dockerfile: Dockerfile
    image: auth-circuit-breaker-image
    expose:
      - "8000"
    environment:
      UPSTREAM_AUTH_BASE_URL: http://authapi:8000
    depends_on:
      authapi:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "python3", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health')" ]
      interval: 10s
      timeout: 5s
      retries: 3

  auth-db:
    image: postgres:17.4
    volumes:
      - pg-data-auth:/var/lib/postgresql/data
    env_file:
      - ./auth-service/.env
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
  
  auth-redis:
    image: redis:7.4.3
    volumes:
      - auth-redis-data:/data
      - ./auth-service/src/configs/redis/redis.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf
    env_file:
      - ./auth-service/.env
    expose:
      - "${REDIS_PORT}"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 10s
      retries: 15

  admin-session-storage:
    image: postgres:17.4
    env_file:
      - ./admin/.env
    volumes:
      - admin-session-storage:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U admin_user -d admin_session_storage" ]
      interval: 5s
      timeout: 5s
      retries: 5

  admin:
    build:
      context: ./admin
    expose:
      - "8000"
    env_file:
      - ./admin/.env
    depends_on:
      admin-session-storage:
        condition: service_healthy
      auth-circuit-breaker:
        condition: service_healthy
      fastapi:
        condition: service_started
    restart: unless-stopped
    volumes:
      - admin-static:/app/static

volumes:
  pg-data:
  elastic-data:
  redis-data:
  pg-data-auth:
  auth-redis-data:
  admin-static:
  admin-session-storage:
