[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "redis-rate-limit"
version = "0.1.0"
description = "Per-IP fixed-window rate limiting using Redis (async)"
requires-python = ">=3.12"
dependencies = [
    "redis>=5.0",
    "starlette>=0.37",
]

[tool.setuptools.packages.find]
where = ["src"]
